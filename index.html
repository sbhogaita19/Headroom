function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    const val=attrs[k];
    if(k==="class")e.className=val;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),val);
    else if(val===true)e.setAttribute(k,"");

/* ---------- HABITS ---------- */
function dkey(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function viewHabits(){
  setHeader("Habits","Small, cued and tracked. Good practice only pays off when it's automatic.");
  const v=h("div");
  let log=store(true,"headroom2:habitlog")||{};
  const active=store(true,"headroom2:active")||HABITS.slice(0,3).map(x=>x[0]);
  const today=dkey(new Date());
  const THRESH=1;
  const strip=h("div",{style:"display:flex;gap:6px;margin-top:10px"});
  const streakEl=h("div",{class:"big"}),streakNote=h("div",{class:"mute"});
  function activeDone(date){return (log[date]||[]).filter(id=>active.includes(id)).length}
  function calcStreak(){
    let n=0,d=new Date();
    const full=date=>active.length>0&&activeDone(date)>=Math.min(active.length,Math.max(THRESH,active.length));
    if(!full(dkey(d)))d.setDate(d.getDate()-1);
    while(full(dkey(d))){n++;d.setDate(d.getDate()-1)}
    return n;
  }
  function drawSummary(){
    const s=calcStreak();
    streakEl.textContent=s+(s===1?" day":" days");
    streakNote.textContent=active.length?"Streak counts days you finish every habit you've switched on.":"Switch on one to three habits below.";
    const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
    strip.replaceChildren(...days.map(d=>{const k=dkey(d);const c=activeDone(k),t=Math.max(1,active.length);
      const op=c===0?0.12:0.3+0.7*(c/t);
      return h("div",{style:"flex:1;text-align:center;font-size:11px;color:var(--mute)"},
        h("div",{style:`height:28px;border-radius:7px;background:var(--acc);opacity:${op}`,title:k+": "+c+" done"}),
        ["S","M","T","W","T","F","S"][d.getDay()])}));
  }
  v.append(h("div",{class:"card"},h("div",{class:"mute"},"Current streak"),streakEl,streakNote,strip));
  v.append(h("div",{class:"cap"},"Today"));
  const g=h("div",{class:"group"});
  const doneToday=new Set(log[today]||[]);
  function saveLog(){log[today]=[...doneToday];store(false,"headroom2:habitlog",log);drawSummary()}
  HABITS.forEach(([id,name,cue])=>{
    const on=h("input",{type:"checkbox",id:"hb_"+id,"aria-label":"Done today: "+name});
    on.checked=doneToday.has(id);
    on.addEventListener("change",()=>{on.checked?doneToday.add(id):doneToday.delete(id);saveLog()});
    const sw=h("input",{type:"checkbox","aria-label":"Track "+name,style:"width:18px;height:18px;accent-color:var(--acc)"});
    sw.checked=active.includes(id);
    sw.addEventListener("change",()=>{const i=active.indexOf(id);if(sw.checked&&i<0)active.push(id);if(!sw.checked&&i>=0)active.splice(i,1);store(false,"headroom2:active",active);drawSummary()});
    g.append(h("div",{class:"check"},on,h("div",{style:"flex:1"},h("label",{for:"hb_"+id,style:"font-weight:600"},name),h("div",{class:"mute"},cue)),
      h("label",{style:"margin:0;display:flex;gap:6px;align-items:center;font-size:12px"},sw,"track")));
  });
  v.append(g);
  v.append(h("p",{class:"mute",style:"margin:8px 4px"},"Tick “track” on two or three habits to start. Ticks are saved in this browser only."));
  drawSummary();
  v.append(h("div",{class:"cap"},"Make them stick"));
  v.append(h("div",{class:"card"},h("ol",{class:"steps"},
    h("li",{},h("b",{},"Anchor it: "),"“When I [existing cue], I will [tiny action].”"),
    h("li",{},h("b",{},"Start tiny: "),"a 30-second brief beats a perfect one you skip."),
    h("li",{},h("b",{},"Track it: "),"the streak above is the reward."),
    h("li",{},h("b",{},"Review weekly: "),"keep what helps, drop what doesn't."))));
  v.append(h("div",{class:"cap"},"Weekly review"));
  const wsaved=store(true,"headroom2:weekly")||{};
  const wk=dkey(new Date(Date.now()-((new Date().getDay()+6)%7)*86400000));
  const wdone=new Set(wsaved[wk]||[]);
  const wg=h("div",{class:"group"}),wc=h("p",{class:"mute",style:"margin:8px 4px"});
  function wupd(){wc.textContent=wdone.size+" of "+WEEKLY.length+" done this week"}
  WEEKLY.forEach((c,i)=>{const cb=h("input",{type:"checkbox",id:"wk"+i});cb.checked=wdone.has(i);
    cb.addEventListener("change",()=>{cb.checked?wdone.add(i):wdone.delete(i);wsaved[wk]=[...wdone];store(false,"headroom2:weekly",wsaved);wupd()});
    wg.append(h("div",{class:"check"},cb,h("label",{for:"wk"+i},c)))});
  v.append(wg,wc);wupd();
  v.append(h("div",{class:"cap"},"Promote a prompt to a skill"));
  const pre=h("pre",{},h("code",{},SKILL_TEMPLATE)),st=h("span",{class:"mute",style:"margin-left:10px"});
  v.append(h("div",{class:"card"},pre,h("button",{class:"btn soft",onclick:()=>copy(SKILL_TEMPLATE,st)},"Copy template"),st,
    h("p",{class:"mute",style:"margin-top:10px"},"Save as lean-pr-review/SKILL.md in your skills folder. The Coach tab can turn any prompt you reuse into a skill like this.")));
  return v;
}

/* ---------- COACH ---------- */
function corpus(){
  const d=[];
  SRC.forEach(s=>d.push({k:"source: "+s.title+" ("+TIER_LABEL[s.tier]+")",t:s.blurb+" "+s.url}));
  LESSONS.forEach(l=>d.push({k:"lesson: "+l.title,t:[l.why,...l.steps,...l.models.map(m=>m[0]+": "+m[1])].join(" ")}));
  TASKS.forEach(t=>d.push({k:"task: "+t.t+" ("+t.tier+")",t:t.steps.join(" ")+" Token habit: "+t.token+" Avoid: "+t.avoid}));
  TIERS.forEach(t=>d.push({k:"tier: "+t.k,t:t.d+" "+Object.entries(t.ex).map(e=>e[0]+": "+e[1]).join("; ")}));
  SUITE.forEach(s=>d.push({k:"tool: "+s[0],t:s[1]+". "+s[2]}));
  NEWS.forEach(n=>d.push({k:"news: "+n.t,t:n.sum+" "+n.why}));
  return d;
}
const COACH_SYSTEM=`You are the Coach inside Headroom, a briefing app for an AI developer who uses a suite of LLMs and agents (Claude, OpenAI, Gemini, Mistral, DeepSeek, Qwen, Cursor, Copilot) and works in Ghostty with herdr and the omp coding agent.
Goals: cut wasted tokens, pick the right model tier and tool for the task, make prompts, AGENTS.md and SKILL.md files clearer, and help build good habits.
Rules:
- Call search_library to ground advice in the app's curated notes before answering. Say plainly when something is general knowledge instead.
- Be model-neutral unless a target agent is named. Prefer AGENTS.md and the open Agent Skills format.
- Be concrete: quote the problem lines, give a rewrite, estimate savings (about 4 characters per token).
- Do not invent commands, settings or model names. Point to the vendor docs when unsure.
- Format: Findings, Rewrite, Expected saving. Plain text, no tables.`;
function viewCoach(){
  setHeader("Coach","Paste an AGENTS.md, a skill or a brief. Or describe a task and get a plan.");
  const v=h("div");
  const ta=h("textarea",{placeholder:"Paste text here…","aria-label":"Text to audit"});
  const cnt=h("p",{class:"mute",style:"margin:6px 4px"},"0 chars ≈ 0 tokens");
  ta.addEventListener("input",()=>{const n=ta.value.length;cnt.textContent=n.toLocaleString()+" chars ≈ "+Math.round(n/4).toLocaleString()+" tokens"});
  const goal=h("select",{},h("option",{value:"tokens"},"Cut tokens, keep behaviour"),h("option",{value:"skill"},"Turn into a SKILL.md"),h("option",{value:"agents"},"Turn into a cross-tool AGENTS.md"),h("option",{value:"prompt"},"Rewrite as an agent brief"),h("option",{value:"route"},"Recommend model tier and workflow for this task"));
  const target=h("select",{},["Any agent","Claude Code","OpenAI Codex","Gemini CLI","Cursor","GitHub Copilot","Mistral Vibe","Qwen Code","omp"].map((x,i)=>h("option",{value:i?x:"any"},x)));
  const out=h("div",{class:"card out",hidden:true,"aria-live":"polite"});
  const btn=h("button",{class:"btn"},"Run");
  const ask=h("input",{type:"text",placeholder:"Or ask: which tier for a flaky test?","aria-label":"Question"});
  const askBtn=h("button",{class:"btn soft"},"Ask");
  let ctrl=null,sp=null;
  const getSample=()=>sp||(sp=(window.claude&&window.claude.use?window.claude.use("sample"):Promise.resolve(null)).catch(()=>null));
  async function run(prompt,button){
    const sample=await getSample();
    out.hidden=false;
    if(!sample){
      const full=COACH_SYSTEM+"\n\n"+prompt;
      const st=h("span",{class:"mute",style:"margin-left:10px"});
      out.replaceChildren(h("p",{},"Not running inside Claude, so here is a ready-made prompt. Paste it into any model you use, ideally one with web or file access."),
        h("pre",{style:"white-space:pre-wrap"},h("code",{},full)),
        h("button",{class:"btn soft",onclick:()=>copy(full,st)},"Copy prompt"),st);
      return}
    if(ctrl)ctrl.abort();ctrl=new AbortController();
    out.textContent="Thinking…";button.disabled=true;
    const tools=[{name:"search_library",description:"Search Headroom's curated sources, lessons, tasks, tiers, tools and news. Returns up to 5 matches.",
      inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},
      execute:async({query})=>{const w=String(query||"").toLowerCase().split(/\W+/).filter(x=>x.length>2);
        return corpus().map(d=>({d,s:w.filter(x=>(d.k+" "+d.t).toLowerCase().includes(x)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,5).map(x=>({source:x.d.k,note:x.d.t}))}}];
    try{
      const r=await sample([{role:"user",content:COACH_SYSTEM+"\n\n"+prompt}],{tools,cache:false,signal:ctrl.signal,modelTier:"default",onText:({text})=>{out.textContent=text}});
      out.textContent=r.text+(r.truncated?"\n\n[truncated]":"");
    }catch(e){
      if(e&&e.code==="not_granted")out.textContent="Permission was declined, so the Coach is off for this page load.";
      else if(e&&e.code==="rate_limited")out.textContent="Rate limited. Wait a moment and try again.";
      else if(e&&e.name==="AbortError"){}
      else out.textContent="Something went wrong: "+((e&&e.message)||"unknown error");
    }finally{button.disabled=false}
  }
  btn.addEventListener("click",()=>{
    const txt=ta.value.trim();if(!txt){out.hidden=false;out.textContent="Paste or describe something first.";return}
    const g={tokens:"Audit the text below for token waste (redundancy, pasted docs, vague rules, things better moved into skills or fetched on demand) and give a leaner rewrite.",
      skill:"Convert the text below into a well-formed SKILL.md: name, trigger-specific description, concise steps, pointers to references/ for detail.",
      agents:"Convert the text below into a short, cross-tool AGENTS.md: commands, conventions, gotchas, links instead of pasted docs.",
      prompt:"Rewrite the text below as a strong brief for a coding agent: goal, constraints, done-criteria, verification command.",
      route:"The text below describes a task. Recommend a model tier (Planner, Workhorse, Sprinter or Local), a workflow with steps, which of my tools to run it in, and the biggest token-saving habit. Use the library's tiers and tasks."}[goal.value];
    run(g+(target.value!=="any"?"\nTarget agent: "+target.value+".":"")+"\n\n<text>\n"+txt.slice(0,30000)+"\n</text>",btn);
  });
  askBtn.addEventListener("click",()=>{const q=ask.value.trim();if(!q)return;run("Answer for the developer, grounded in the library: "+q,askBtn)});
  v.append(h("div",{class:"card"},h("label",{style:"margin-top:0"},"What to do"),goal,h("label",{},"Target agent"),target,h("label",{},"Text"),ta,cnt,btn));
  v.append(h("div",{class:"card"},ask,h("div",{style:"margin-top:10px"},askBtn)));
  v.append(out);
  v.append(h("p",{class:"mute",style:"margin:8px 4px"},"Inside Claude, the Coach answers here. Elsewhere it builds a prompt you can paste into any model."));
  return v;
}

function icon(name){
  const d=new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>',"image/svg+xml");
  const s=document.importNode(d.documentElement,true);s.setAttribute("aria-hidden","true");return s;
}
const TABS=[["today","Today"],["pick","Pick"],["learn","Learn"],["library","Library"],["habits","Habits"],["coach","Coach"]];
